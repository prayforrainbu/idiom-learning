
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>成語學習樂園｜登入測試</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f8fb;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      color: #26384a;
    }
    .panel {
      width: min(360px, calc(100% - 48px));
      background: white;
      border: 1px solid #e4edf3;
      border-radius: 18px;
      padding: 28px;
    }
    h1 { font-size: 24px; }
    label { display: block; margin-top: 18px; }
    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #dce7ef;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #5c9ed2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    p { color: #718397; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>📚 成語學習樂園</h1>
    <p>學生登入｜V1.2 測試版</p>

    <form id="loginForm">
      <label for="username">學生帳號</label>
      <input id="username" autocomplete="username" required>

      <label for="pin">6 位數登入 PIN</label>
      <input id="pin" type="password"
             inputmode="numeric"
             pattern="[0-9]{6}"
             maxlength="6"
             autocomplete="off" required>

      <button type="submit">登入</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  
<script>
  const FUNCTION_URL =
    "https://dluvolqcbyeoiusaixcz.supabase.co/functions/v1/idiom-auth";

 

document.getElementById("loginForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    const button = document.querySelector(
      '#loginForm button[type="submit"]'
    );

    message.textContent = "正在確認登入服務狀態...";
    button.disabled = true;

    try {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "health"
        })
      });

      if (!response.ok) {
        throw new Error("無法確認登入服務狀態");
      }

      const data = await response.json();

      if (data.login_enabled !== true) {
        message.textContent =
          "🔒 學生登入尚未開放，請稍後再試。";
        return;
      }

      const username = document.getElementById("username")
        .value.trim().toLowerCase();

      const pin = document.getElementById("pin").value;

      message.textContent = "正在驗證學生帳號...";

      const result = await loginStudent(username, pin);

      // 暫時不儲存登入憑證
      // 等安全檢查完成後，再設計登入狀態管理
      message.textContent =
        "✅ 帳號驗證成功，學習紀錄功能尚未開放。";

    } catch (error) {
      message.textContent =
        "❌ " + (error.message || "登入服務發生錯誤");
    } finally {
      document.getElementById("pin").value = "";
      button.disabled = false;
    }
  });



async function loginStudent(username, pin) {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "login",
      username: username,
      pin: pin
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "登入失敗，請稍後再試"
    );
  }

  return data;
}

  async function checkConnection() {
    const message = document.getElementById("message");
    message.textContent = "正在檢查 Supabase 連線...";

    try {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "health"
        })
      });

      const data = await response.json();

      if (
        response.ok &&
        data.configuration === "ready" &&
        data.status === "maintenance" &&
        data.login_enabled === false &&
        data.registration_enabled === false
      ) {
        message.textContent =
          "✅ Supabase 連線成功！登入及註冊功能仍維持關閉。";
      } else {
        message.textContent =
          "⚠️ 已收到伺服器回應，但設定與預期不同。";
      }
    } catch (error) {
      message.textContent =
        "❌ Supabase 連線失敗：" + error.message;
    }
  }

  
  
  async function testLoginProtection() {
    const message = document.getElementById("message");

    try {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "login"
        })
      });

      const data = await response.json();

      if (
        response.status === 503 &&
        data.error === "登入功能維護中"
      ) {
        message.textContent =
          "✅ 安全測試通過：未授權登入已被阻擋。";
      } else {
        message.textContent =
          "⚠️ 安全測試結果與預期不同，HTTP 狀態：" +
          response.status;
      }
    } catch (error) {
      message.textContent =
        "❌ 安全測試失敗：" + error.message;
    }
  }

  testLoginProtection();

</script>

</body>
</html>
