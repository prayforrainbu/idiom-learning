<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成語學習樂園</title>
<style>
:root{--ink:#26384a;--muted:#718397;--blue:#5c9ed2;--pale:#eaf4fb;--green:#6aa994;--line:#e4edf3;--bg:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:15px max(18px,calc((100% - 1080px)/2));font-size:20px;font-weight:800}main{max-width:1080px;margin:26px auto;padding:0 18px 50px}.hero,.panel,.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(110deg,#eaf4fb,#edf7f2);display:flex;justify-content:space-between;align-items:center}h1{margin:0 0 8px;font-size:30px}h2{font-size:20px;margin:0 0 16px}p{color:var(--muted);line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{margin:0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}.tabs,.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:650}.primary{background:var(--blue);color:white}.soft{background:var(--pale);color:#477ca3}.plain{background:white;border:1px solid var(--line);color:var(--ink)}.active{outline:2px solid #8dbbda}input,select{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:white;min-width:0}input{flex:1;min-width:200px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.card h3{margin:9px 0 4px;font-size:21px}.muted{color:var(--muted);font-size:13px}.meaning{min-height:48px;line-height:1.65;font-size:14px}.tag{font-size:12px;background:#f0f5f8;padding:4px 8px;border-radius:20px;color:#637d91}.check{accent-color:var(--blue)}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#f1f7fb;border-radius:12px;padding:13px;margin-top:16px}.hidden{display:none!important}.question{font-size:21px;line-height:1.6;margin:15px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{text-align:left;background:#f4f8fb;border:1px solid var(--line)}.option.correct{background:#e6f5ec;border:1px solid #8bc4a2}.option.wrong{background:#fff0ef;border:1px solid #e3a19b}.result{padding:12px;border-radius:10px;background:#f2f7fa;margin-top:13px;line-height:1.7}footer{text-align:center;color:#9aa8b4;font-size:12px;padding:15px}@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards,.options{grid-template-columns:1fr}
.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:13px}.hero{padding:18px}h1{font-size:24px}}
</style></head><body><header>📚 成語學習樂園</header><main>
<section class="hero"><div><h1>每天學一點，累積成語力！</h1><p>搜尋、挑選成語，自由安排學習內容。自選數量不限。</p></div><div style="font-size:48px">🌱</div></section>
<section class="stats"><div class="stat"><small>資料庫成語</small><strong id="total">30</strong></div><div class="stat"><small>本次已選</small><strong id="picked">0</strong></div><div class="stat"><small>累積作答題數（本裝置）</small><strong id="answered">0</strong></div><div class="stat"><small>已學成語（本裝置）</small><strong id="learned">0</strong></div></section>
<section class="panel"><div class="tabs"><button class="soft active" id="libraryTab">成語圖書館</button><button class="plain" id="quizTab">成語測驗</button><button class="plain" id="mistakeTab">我的錯題本</button></div>

<div class="row" style="gap:10px;margin-bottom:15px;flex-wrap:wrap;">
  <button type="button" class="soft" onclick="selectAll()">一鍵全選</button>
  <button type="button" class="soft" onclick="clearAll()">取消全選</button>
</div>

<div id="library"><h2 style="margin-top:18px">搜尋並自選成語</h2><div class="row"><input id="search" placeholder="搜尋成語、注音或解釋"><select id="level"><option>全部難度</option><option>初級</option><option>中級</option><option>高級</option></select></div>
<div class="bar">
  <span>已選 <b id="chosen">0</b> 個成語（不限數量）</span>
  <div class="row">
    <button class="plain" id="clear">清除</button>
    <button class="primary" id="startLearn">開始學習</button>
    <button class="soft" id="startQuiz">用選取成語測驗</button>
  </div>
</div>
<div id="cards" class="cards"></div>
</div>

<div id="quiz" class="hidden"><h2 style="margin-top:18px">成語測驗</h2><p>可測驗本次選取的成語；若沒有選取，系統會從資料庫出題。每題依解釋選出正確成語。</p><div class="row"><select id="quizCount"><option value="10">10 題</option><option value="20">20 題</option><option value="all">全部可用題目</option></select><button class="primary" id="beginQuiz">開始測驗</button></div><div id="quizArea" class="hidden"><div class="muted" id="progress"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="result hidden" id="feedback"></div><div class="bar"><span id="score"></span><button class="primary" id="next" disabled>下一題</button></div></div></div>
</section>
<div id="mistakePage" class="panel hidden">
  <h2>📕 我的錯題本</h2>
  <p>這裡會顯示測驗答錯的成語，方便日後複習。</p>
 <button class="primary" id="retryMistakes">重新測驗錯題</button>
<div id="mistakeList"></div>
</div>
<section class="panel"><h2>學習紀錄（目前儲存在這台裝置）</h2><p id="history">完成測驗後，這裡會顯示最近一次成績。正式雲端版會再加入家庭帳號及跨裝置同步。</p></section>
</main><footer>成語學習樂園｜互動原型 V1.1・資料為教學示範，後續可持續校訂擴充</footer>
<script>
let idioms=[{"word": "一馬當先", "zhuyin": "ㄧ ㄇㄚˇ ㄉㄤ ㄒㄧㄢ", "meaning": "形容領先或帶頭。", "example": "他一馬當先，帶領隊伍抵達終點。", "level": "初級"}, {"word": "七嘴八舌", "zhuyin": "ㄑㄧ ㄗㄨㄟˇ ㄅㄚ ㄕㄜˊ", "meaning": "形容許多人同時說話，議論紛紛。", "example": "大家七嘴八舌地討論班級活動。", "level": "初級"}, {"word": "手忙腳亂", "zhuyin": "ㄕㄡˇ ㄇㄤˊ ㄐㄧㄠˇ ㄌㄨㄢˋ", "meaning": "形容做事慌張，沒有條理。", "example": "上台前才發現忘了帶講稿，他頓時手忙腳亂。", "level": "初級"}, {"word": "心花怒放", "zhuyin": "ㄒㄧㄣ ㄏㄨㄚ ㄋㄨˋ ㄈㄤˋ", "meaning": "形容心情非常愉快。", "example": "收到好消息，她高興得心花怒放。", "level": "初級"}, {"word": "四腳朝天", "zhuyin": "ㄙˋ ㄐㄧㄠˇ ㄔㄠˊ ㄊㄧㄢ", "meaning": "形容仰面跌倒的樣子。", "example": "地板太滑，他一不小心摔個四腳朝天。", "level": "初級"}, {"word": "七手八腳", "zhuyin": "ㄑㄧ ㄕㄡˇ ㄅㄚ ㄐㄧㄠˇ", "meaning": "形容許多人一起動手。", "example": "大家七手八腳地把教室布置完成。", "level": "初級"}, {"word": "七上八下", "zhuyin": "ㄑㄧ ㄕㄤˋ ㄅㄚ ㄒㄧㄚˋ", "meaning": "形容心情忐忑不安。", "example": "公布成績前，他心裡七上八下。", "level": "初級"}, {"word": "大吃一驚", "zhuyin": "ㄉㄚˋ ㄔ ㄧ ㄐㄧㄥ", "meaning": "形容受到很大的驚嚇或意外。", "example": "看到突然出現的生日蛋糕，她大吃一驚。", "level": "初級"}, {"word": "迫不及待", "zhuyin": "ㄆㄛˋ ㄅㄨˋ ㄐㄧˊ ㄉㄞˋ", "meaning": "急切得不能再等待。", "example": "新書一到，他就迫不及待地讀起來。", "level": "初級"}, {"word": "專心致志", "zhuyin": "ㄓㄨㄢ ㄒㄧㄣ ㄓˋ ㄓˋ", "meaning": "形容一心一意，集中精神。", "example": "她專心致志地完成拼圖。", "level": "初級"}, {"word": "霧裡看花", "zhuyin": "ㄨˋ ㄌㄧˇ ㄎㄢˋ ㄏㄨㄚ", "meaning": "比喻看事情不清楚、不真切。", "example": "沒有看清楚說明，整件事像霧裡看花。", "level": "中級"}, {"word": "忙中有錯", "zhuyin": "ㄇㄤˊ ㄓㄨㄥ ㄧㄡˇ ㄘㄨㄛˋ", "meaning": "因忙碌而容易發生錯誤。", "example": "他趕著出門，忙中有錯，忘了帶鑰匙。", "level": "中級"}, {"word": "歪打正著", "zhuyin": "ㄨㄞ ㄉㄚˇ ㄓㄥˋ ㄓㄠˊ", "meaning": "原本方法不對，卻意外得到好結果。", "example": "他本想找鉛筆，卻歪打正著找到遺失的橡皮擦。", "level": "中級"}, {"word": "翩翩起舞", "zhuyin": "ㄆㄧㄢ ㄆㄧㄢ ㄑㄧˇ ㄨˇ", "meaning": "形容輕快地跳起舞來。", "example": "蝴蝶在花叢間翩翩起舞。", "level": "中級"}, {"word": "胸有成竹", "zhuyin": "ㄒㄩㄥ ㄧㄡˇ ㄔㄥˊ ㄓㄨˊ", "meaning": "比喻做事之前已有完整的想法或把握。", "example": "她準備充分，回答問題時胸有成竹。", "level": "中級"}, {"word": "畫蛇添足", "zhuyin": "ㄏㄨㄚˋ ㄕㄜˊ ㄊㄧㄢ ㄗㄨˊ", "meaning": "比喻做了多餘的事，反而不恰當。", "example": "文章已經很完整，再加一段反而畫蛇添足。", "level": "中級"}, {"word": "守株待兔", "zhuyin": "ㄕㄡˇ ㄓㄨ ㄉㄞˋ ㄊㄨˋ", "meaning": "比喻不主動努力，只想靠僥倖獲得成功。", "example": "想靠運氣考高分，無異於守株待兔。", "level": "中級"}, {"word": "亡羊補牢", "zhuyin": "ㄨㄤˊ ㄧㄤˊ ㄅㄨˇ ㄌㄠˊ", "meaning": "出了問題後及時補救，還不算晚。", "example": "發現計算錯誤後立刻訂正，也算亡羊補牢。", "level": "中級"}, {"word": "刻舟求劍", "zhuyin": "ㄎㄜˋ ㄓㄡ ㄑㄧㄡˊ ㄐㄧㄢˋ", "meaning": "比喻拘泥成法，不懂得依情況變通。", "example": "環境已經改變，還照舊方法處理，簡直刻舟求劍。", "level": "高級"}, {"word": "杯弓蛇影", "zhuyin": "ㄅㄟ ㄍㄨㄥ ㄕㄜˊ ㄧㄥˇ", "meaning": "比喻因疑神疑鬼而自相驚擾。", "example": "弄清楚只是窗簾的影子後，他才知道自己杯弓蛇影。", "level": "高級"}, {"word": "滄海一粟", "zhuyin": "ㄘㄤ ㄏㄞˇ ㄧ ㄙㄨˋ", "meaning": "比喻非常渺小。", "example": "個人的力量放在浩瀚世界中，猶如滄海一粟。", "level": "高級"}, {"word": "水到渠成", "zhuyin": "ㄕㄨㄟˇ ㄉㄠˋ ㄑㄩˊ ㄔㄥˊ", "meaning": "條件成熟，事情自然成功。", "example": "只要持續練習，成果自然水到渠成。", "level": "中級"}, {"word": "一目了然", "zhuyin": "ㄧ ㄇㄨˋ ㄌㄧㄠˇ ㄖㄢˊ", "meaning": "一看就很清楚明白。", "example": "圖表整理得很清楚，數據一目了然。", "level": "中級"}, {"word": "舉一反三", "zhuyin": "ㄐㄩˇ ㄧ ㄈㄢˇ ㄙㄢ", "meaning": "從一件事類推，理解其他相關事物。", "example": "學會解題方法後，他能舉一反三。", "level": "中級"}, {"word": "不可思議", "zhuyin": "ㄅㄨˋ ㄎㄜˇ ㄙ ㄧˋ", "meaning": "難以想像或理解。", "example": "這座橋在短時間內完工，真是不可思議。", "level": "初級"}, {"word": "半途而廢", "zhuyin": "ㄅㄢˋ ㄊㄨˊ ㄦˊ ㄈㄟˋ", "meaning": "事情未完成就中途停止。", "example": "學習樂器要持之以恆，不可半途而廢。", "level": "初級"}, {"word": "津津有味", "zhuyin": "ㄐㄧㄣ ㄐㄧㄣ ㄧㄡˇ ㄨㄟˋ", "meaning": "形容興味濃厚。", "example": "他看著有趣的故事，讀得津津有味。", "level": "初級"}, {"word": "同心協力", "zhuyin": "ㄊㄨㄥˊ ㄒㄧㄣ ㄒㄧㄝˊ ㄌㄧˋ", "meaning": "大家一條心，共同努力。", "example": "全班同心協力，完成了園遊會布置。", "level": "初級"}, {"word": "自相矛盾", "zhuyin": "ㄗˋ ㄒㄧㄤ ㄇㄠˊ ㄉㄨㄣˋ", "meaning": "言語或行為前後抵觸。", "example": "他一下說有空，一下又說沒時間，說法自相矛盾。", "level": "高級"}, {"word": "雪中送炭", "zhuyin": "ㄒㄩㄝˇ ㄓㄨㄥ ㄙㄨㄥˋ ㄊㄢˋ", "meaning": "在別人急需時給予幫助。", "example": "我忘了帶雨傘，同學借我一把，真是雪中送炭。", "level": "中級"}];
let selected=new Set(),viewed=new Set(JSON.parse(localStorage.getItem('idiomViewed')||'[]')),answered=Number(localStorage.getItem('idiomAnswered')||0),quizList=[],qi=0,score=0,wrong=[];

let quizQuestions = [];

async function loadQuizQuestions(){
  try {
    const response = await fetch("./quiz_questions.json");
    if (!response.ok) throw new Error("無法讀取測驗題庫");

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("題庫格式不正確");

    quizQuestions = data.filter(q =>
      q.reviewed === true &&
      typeof q.question === "string" &&
      typeof q.answer === "string" &&
      Array.isArray(q.options) &&
      q.options.length === 4 &&
      q.options.includes(q.answer)
    );

    console.log("已載入審核通過的測驗題目：" + quizQuestions.length + "題");
  } catch (error) {
    console.error("測驗題庫載入失敗：", error);
  }
}


loadQuizQuestions();
let mistakeBook = new Set(JSON.parse(localStorage.getItem('idiomMistakes') || '[]'));  
let masteredIdioms = new Set(JSON.parse(localStorage.getItem('idiomMastered') || '[]'));
document.getElementById('learned').textContent = masteredIdioms.size;
const $=id=>document.getElementById(id);
$('total').textContent=idioms.length;$('answered').textContent=answered;
$('learned').textContent=masteredIdioms.size;
function render(){let q=$('search').value.trim().toLowerCase(),lv=$('level').value;let list=idioms.filter(x=>(lv==='全部難度'||x.level===lv)&&(!q||(x.word+x.zhuyin+x.meaning).toLowerCase().includes(q)));$('cards').innerHTML=list.map(x=>`<article class="card"><div class="row" style="justify-content:space-between"><span class="tag">${x.level}</span><input class="check" style="flex:0;width:18px;min-width:18px" type="checkbox" ${selected.has(x.word)?'checked':''} onchange="toggle('${x.word}')"></div>
<h3>${x.word} ${masteredIdioms.has(x.word)?'<span style="font-size:12px;color:#43866b;background:#e6f5ec;padding:4px 8px;border-radius:20px">✓ 已學會</span>':''}</h3><div class="muted">${x.zhuyin}</div>
<p class="meaning">${x.meaning}</p><button class="soft" onclick="detail('${x.word}')">查看例句</button></article>`).join('');$('picked').textContent=selected.size;$('chosen').textContent=selected.size}
function selectAll(){
  let q=$('search').value.trim().toLowerCase();
  let lv=$('level').value;

  let list=idioms.filter(x=>
    (lv==='全部難度'||x.level===lv)&&
    (!q||(x.word+x.zhuyin+x.meaning).toLowerCase().includes(q))
  );

  list.forEach(x=>selected.add(x.word));
  render();
}

function clearAll(){
  selected.clear();
  render();
}

function toggle(w){selected.has(w)?selected.delete(w):selected.add(w);render()}
function detail(w){let x=idioms.find(a=>a.word===w);alert(`${x.word} ${x.zhuyin}\n\n${x.meaning}\n\n例句：${x.example}`);viewed.add(w);localStorage.setItem('idiomViewed',JSON.stringify([...viewed]));
$('learned').textContent=masteredIdioms.size}
$('search').oninput=render;$('level').onchange=render;$('clear').onclick=()=>{selected.clear();render()};
function tab(which){
  $('library').classList.toggle('hidden',which!=='library');
  $('quiz').classList.toggle('hidden',which!=='quiz');
  $('mistakePage').classList.toggle('hidden',which!=='mistake');

  $('libraryTab').className=which==='library'?'soft active':'plain';
  $('quizTab').className=which==='quiz'?'soft active':'plain';
  $('mistakeTab').className=which==='mistake'?'soft active':'plain';
}
$('libraryTab').onclick=()=>tab('library');
$('quizTab').onclick=()=>tab('quiz');
$('mistakeTab').onclick=()=>{
  renderMistakes();
  tab('mistake');
};
$('startLearn').onclick=()=>{let arr=idioms.filter(x=>selected.has(x.word));if(!arr.length){alert('請先選擇至少一個成語。');return}let i=0;function show(){let x=arr[i];let more=i===arr.length-1?'完成':'下一個';if(confirm(`第 ${i+1} / ${arr.length} 個\n\n${x.word}（${x.zhuyin}）\n\n${x.meaning}\n\n例句：${x.example}\n\n按「確定」前往下一個；按「取消」結束。`)){viewed.add(x.word);
localStorage.setItem('idiomViewed',JSON.stringify([...viewed]));
$('learned').textContent=masteredIdioms.size;
if(i<arr.length-1){i++;show()}}}show()};
$('startQuiz').onclick=()=>{tab('quiz');begin(selected.size?idioms.filter(x=>selected.has(x.word)):idioms)};
$('beginQuiz').onclick=()=>begin(selected.size?idioms.filter(x=>selected.has(x.word)):idioms);
function removeMistake(word){
  if(!confirm(`確定要將「${word}」從錯題本移除嗎？`)){
    return;
  }

  mistakeBook.delete(word);
  localStorage.setItem('idiomMistakes',JSON.stringify([...mistakeBook]));
  renderMistakes();
}
  function renderMistakes(){
  let list=idioms.filter(x=>mistakeBook.has(x.word));

  if(list.length===0){
    $('mistakeList').innerHTML='<p>目前沒有錯題，繼續保持！</p>';
    return;
  }

  $('mistakeList').innerHTML=list.map(x=>`
    <article class="card">
      
<h3>${x.word} ${masteredIdioms.has(x.word)?'<span style="font-size:12px;color:#43866b;background:#e6f5ec;padding:4px 8px;border-radius:20px">✓ 已學會</span>':''}</h3>

      <div class="muted">${x.zhuyin}</div>
      <p class="meaning">${x.meaning}</p>
      <p>例句：${x.example}</p>
      <button class="soft" onclick="removeMistake('${x.word}')">移除錯題</button>
    </article>
  `).join('');
}
$('retryMistakes').onclick=()=>{
  let pool=idioms.filter(x=>mistakeBook.has(x.word));

  if(pool.length===0){
    alert('目前沒有錯題可以測驗！');
    return;
  }

  tab('quiz');
  begin(pool);
};

function begin(pool){
  
let source = quizQuestions.length > 0
  ? quizQuestions.filter(q => pool.some(x => x.word === q.word))
  : pool;

  let n = $('quizCount').value === 'all'
    ? source.length
    : Number($('quizCount').value);

  quizList = [...source].sort(() => Math.random() - .5).slice(0, n);

if (quizList.length === 0) {
  alert('目前沒有符合條件且已審核的測驗題目！');
  return;
}

  qi = 0;
  score = 0;
  wrong = [];
  $('quizArea').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){let x=quizList[qi];$('progress').textContent=`第 ${qi+1} / ${quizList.length} 題`;
$('question').textContent = x.question || `「${x.meaning}」最適合哪個成語？`;
$('feedback').classList.add('hidden');$('next').disabled=true;$('score').textContent=`目前答對：${score} 題`;
let opts = Array.isArray(x.options)
  ? [...x.options].sort(() => Math.random() - .5)
  : [x, ...idioms.filter(a =>
      a.word && a.word.trim() &&
      a.meaning && a.meaning.trim() &&
      a.word !== x.word
    ).sort(() => Math.random() - .5).slice(0, 3)]
    .map(a => a.word)
    .sort(() => Math.random() - .5);

$('options').innerHTML = '';

opts.forEach(option => {
  const btn = document.createElement('button');
  btn.className = 'option';
  btn.textContent = option;
  btn.onclick = () => answer(option, x.answer || x.word, btn);
  $('options').appendChild(btn);
});
}
function answer(choice,correct,btn){if ($('next').disabled === false) return;let buttons=[...$('options').children];buttons.forEach(b=>b.disabled=true);let ok=choice===correct;
if(ok){
  score++;
  btn.classList.add('correct');

  masteredIdioms.add(quizList[qi].word);
  localStorage.setItem('idiomMastered', JSON.stringify([...masteredIdioms]));
  document.getElementById('learned').textContent = masteredIdioms.size;
  render();
}
else{btn.classList.add('wrong');buttons.find(b=>b.textContent===correct)?.classList.add('correct');
wrong.push(quizList[qi].word);
mistakeBook.add(quizList[qi].word);
localStorage.setItem('idiomMistakes', JSON.stringify([...mistakeBook]))}answered++;localStorage.setItem('idiomAnswered',answered);$('answered').textContent=answered;$('feedback').textContent=ok?'答對了！':'再記一次：'+correct+'。'+(idioms.find(x=>x.word===quizList[qi].word)?.meaning || quizList[qi].explanation || '');$('feedback').classList.remove('hidden');$('next').disabled=false;$('score').textContent=`目前答對：${score} 題`}
$('next').onclick=()=>{if(qi<quizList.length-1){qi++;showQuestion()}else{let pct=Math.round(score/quizList.length*100);$('question').textContent=`測驗完成！答對 ${score} / ${quizList.length} 題，正確率 ${pct}%。`;$('options').innerHTML='';$('feedback').textContent=wrong.length?'需要複習：'+[...new Set(wrong)].join('、'):'太棒了！本次沒有答錯。';$('feedback').classList.remove('hidden');$('progress').textContent='本次測驗結果';$('next').disabled=true;$('history').textContent=`最近一次測驗：${new Date().toLocaleString('zh-TW')}；${score} / ${quizList.length} 題，正確率 ${pct}%；錯題：${[...new Set(wrong)].join('、')||'無'}。`;localStorage.setItem('idiomLastResult',$('history').textContent)}};
render();if(localStorage.getItem('idiomLastResult'))$('history').textContent=localStorage.getItem('idiomLastResult');
async function loadMoeIdioms(){
  try {
    const response = await fetch("./idioms_moe_main.json");
    if (!response.ok) throw new Error("無法讀取成語資料");
    const data = await response.json();

    if (!Array.isArray(data)) throw new Error("資料格式不正確");

    const valid = data.filter(x =>
      x.word && x.zhuyin && x.meaning
    );

    if (valid.length === 0) throw new Error("沒有可用的成語");

    idioms = valid;
    render();
    console.log("教育部成語載入成功：" + idioms.length + "筆");
  } catch (error) {
    console.error("教育部成語載入失敗，保留原本資料：", error);
  }
}

loadMoeIdioms();
